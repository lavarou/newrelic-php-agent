apiVersion: v1
kind: ConfigMap
metadata:
  name: newrelic-ini
  namespace: d1
data:
  newrelic.ini: |
    extension=newrelic.so
    newrelic.enabled=true
    ; Not a secret — this is a reference PHP's own ini parser expands
    ; against the process environment (confirmed empirically). The real
    ; value comes from a Secret via the container's env, never from here.
    newrelic.license=${NEW_RELIC_LICENSE_KEY}
    newrelic.appname=FrankenPHP D1 PoC
    newrelic.loglevel=verbosedebug
    ; /tmp is private per-container; this path is on a volume shared with
    ; the newrelic-agent-log sidecar so its logs are viewable separately
    ; from frankenphp's own via `kubectl logs -c newrelic-agent-log`.
    ; PID is useless for telling replicas apart here — php's built-in
    ; process is PID 1 in every pod's own PID namespace, identically.
    ; POD_NAME (Downward API) makes the filename itself replica-unique.
    newrelic.logfile=/var/log/newrelic/newrelic-agent-${POD_NAME}.log
    ; D1: TCP via the ClusterIP Service, explicit port chosen for this PoC
    ; (not a verified product default — see spec.md). The setting is
    ; newrelic.daemon.address: PHP silently ignores an unregistered name
    ; such as newrelic.daemon, and the agent then falls back to @newrelic.
    newrelic.daemon.address=newrelic-daemon.d1.svc.cluster.local:20080
    newrelic.daemon.app_connect_timeout=20s
