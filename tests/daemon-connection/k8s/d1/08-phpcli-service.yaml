apiVersion: v1
kind: Service
metadata:
  name: phpcli
  namespace: d1
  labels:
    app.kubernetes.io/name: phpcli
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: frankenphp-daemon-poc
spec:
  type: LoadBalancer
  selector: {app.kubernetes.io/name: phpcli}
  ports:
    - port: ${D1_PHPCLI_PORT}
      targetPort: 80
