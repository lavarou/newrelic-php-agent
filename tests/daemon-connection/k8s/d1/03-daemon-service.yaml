apiVersion: v1
kind: Service
metadata:
  name: newrelic-daemon
  namespace: d1
  labels:
    app.kubernetes.io/name: newrelic-daemon
    app.kubernetes.io/component: daemon
    app.kubernetes.io/part-of: frankenphp-daemon-poc
spec:
  # Deliberately NOT headless and NOT LoadBalancer — internal fan-in only,
  # load-balanced by kube-proxy across whichever daemon pods are ready.
  selector: {app.kubernetes.io/name: newrelic-daemon}
  ports:
    - port: 20080
      targetPort: 20080
