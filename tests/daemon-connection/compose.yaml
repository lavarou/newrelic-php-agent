x-newrelic-env: &newrelic-env
  NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:?Set NEW_RELIC_LICENSE_KEY in the environment before running `docker compose up`. See https://docs.docker.com/compose/environment-variables/set-environment-variables/ for more information.}
  NEW_RELIC_HOST: ${NEW_RELIC_HOST:-collector.newrelic.com}

services:
  newrelic-daemon:
    image: newrelic/php-daemon:latest
    command: ["--loglevel", "debug"]
    hostname: newrelic-daemon

  php-cli-musl:
    image: php:8.4-cli-alpine
    environment:
      <<: *newrelic-env
    entrypoint: ["tail"]
    command: ["-f", "/dev/null"]
    volumes:
      - ./artifacts/newrelic-nts-musl.so:/opt/newrelic/newrelic.so:ro
      - ./artifacts/newrelic-daemon-musl:/usr/bin/newrelic-daemon:ro
      - ./newrelic.ini:/usr/local/etc/php/conf.d/zz-newrelic.ini:ro
      - ./fixtures:/app:ro

  php-cli-gnu:
    image: php:8.4-cli-bookworm
    environment:
      <<: *newrelic-env
    entrypoint: ["tail"]
    command: ["-f", "/dev/null"]
    volumes:
      - ./artifacts/newrelic-nts-gnu.so:/opt/newrelic/newrelic.so:ro
      - ./artifacts/newrelic-daemon-gnu:/usr/bin/newrelic-daemon:ro
      - ./newrelic.ini:/usr/local/etc/php/conf.d/zz-newrelic.ini:ro
      - ./fixtures:/app:ro

  php-server-musl:
    image: php:8.4-cli-alpine
    environment:
      <<: *newrelic-env
    entrypoint: ["tail"]
    command: ["-f", "/dev/null"]
    volumes:
      - ./artifacts/newrelic-nts-musl.so:/opt/newrelic/newrelic.so:ro
      - ./artifacts/newrelic-daemon-musl:/usr/bin/newrelic-daemon:ro
      - ./newrelic.ini:/usr/local/etc/php/conf.d/zz-newrelic.ini:ro
      - ./fixtures:/app:ro

  php-server-gnu:
    image: php:8.4-cli-bookworm
    environment:
      <<: *newrelic-env
    entrypoint: ["tail"]
    command: ["-f", "/dev/null"]
    volumes:
      - ./artifacts/newrelic-nts-gnu.so:/opt/newrelic/newrelic.so:ro
      - ./artifacts/newrelic-daemon-gnu:/usr/bin/newrelic-daemon:ro
      - ./newrelic.ini:/usr/local/etc/php/conf.d/zz-newrelic.ini:ro
      - ./fixtures:/app:ro

  frankenphp-musl:
    image: dunglas/frankenphp:1-php8.4-alpine
    environment:
      <<: *newrelic-env
    entrypoint: ["tail"]
    command: ["-f", "/dev/null"]
    volumes:
      - ./artifacts/newrelic-zts-musl.so:/opt/newrelic/newrelic.so:ro
      - ./artifacts/newrelic-daemon-musl:/usr/bin/newrelic-daemon:ro
      - ./newrelic.ini:/usr/local/etc/php/conf.d/zz-newrelic.ini:ro
      - ./fixtures:/app:ro

  frankenphp-gnu:
    image: dunglas/frankenphp:1-php8.4-bookworm
    environment:
      <<: *newrelic-env
    entrypoint: ["tail"]
    command: ["-f", "/dev/null"]
    volumes:
      - ./artifacts/newrelic-zts-gnu.so:/opt/newrelic/newrelic.so:ro
      - ./artifacts/newrelic-daemon-gnu:/usr/bin/newrelic-daemon:ro
      - ./newrelic.ini:/usr/local/etc/php/conf.d/zz-newrelic.ini:ro
      - ./fixtures:/app:ro
